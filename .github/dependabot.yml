version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      mui-major:
        patterns: ['@mui/*']
        update-types: [major]
      storybook-vite-major:
        patterns: ['storybook', '@storybook/*', 'vite', '@vitejs/*']
        update-types: [major]
      lint-major:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*']
        update-types: [major]
      test-runner-major:
        patterns: ['vitest', '@vitest/*']
        update-types: [major]
      virtualization-major:
        patterns: ['react-window', '@types/react-window', 'react-virtualized-auto-sizer']
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
