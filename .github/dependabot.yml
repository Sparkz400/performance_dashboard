version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      nivo:
        patterns:
          - "@nivo/*"
      testing:
        patterns:
          - "@testing-library/*"
          - vitest
          - "@vitest/*"
          - jsdom
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - eslint*
          - "@eslint/*"
          - typescript-eslint
          - prettier
    labels:
      - dependencies
      - client

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - server

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - root

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
