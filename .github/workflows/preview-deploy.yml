name: Preview Deployment

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Preview Image
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment on PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}:pr-${context.issue.number}`;
            const body = `## 🐳 Preview Deployment

            **Docker image built and pushed:**
            \`\`\`
            docker pull ${image}
            \`\`\`

            **Run locally:**
            \`\`\`bash
            docker run -p 3000:3000 \\
              -e DB_HOST=host.docker.internal \\
              -e DB_PORT=5432 \\
              -e DB_USER=postgres \\
              -e DB_PASSWORD=postgres \\
              -e DB_NAME=performance_dashboard \\
              -e REDIS_URL=redis://host.docker.internal:6379 \\
              -e SESSION_SECRET=dev-secret \\
              -e COOKIE_SECRET=dev-secret \\
              ${image}
            \`\`\`

            *Updated for commit ${context.sha.substring(0, 7)}*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    name: Cleanup Preview Image
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete preview image
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const tag = `pr-${context.issue.number}`;
            try {
              const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                package_type: 'container',
                package_name: context.repo.repo,
                org: context.repo.owner,
              });
              const version = versions.data.find(v => v.metadata?.container?.tags?.includes(tag));
              if (version) {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: context.repo.repo,
                  org: context.repo.owner,
                  package_version_id: version.id,
                });
                console.log(`Deleted preview image ${tag}`);
              }
            } catch (e) {
              console.log(`Cleanup skipped: ${e.message}`);
            }
