name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
      - run: npx tsc --noEmit -p client/tsconfig.json
      - run: npm run lint
      - run: npm run format:check -w client
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: |
            client/coverage/
            server/coverage/
          retention-days: 7
  browser:
    name: Browser and database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard-local
          POSTGRES_DB: performance_dashboard
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U dashboard -d performance_dashboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_USERNAME: admin
      E2E_PASSWORD: ci-only-admin-password
      SEED_ADMIN_PASSWORD: ci-only-admin-password
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp server/.env.example server/.env
      - run: npm run build:server
      - run: npm run db:migrate -w server
      - run: npm run db:seed -w server
      - run: node scripts/test-measurements.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t performance-dashboard:ci .
      - run: docker run --rm --entrypoint node performance-dashboard:ci ../scripts/test-runtime.mjs
