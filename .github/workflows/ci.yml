name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Check formatting
        working-directory: client
        run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        working-directory: client
        run: npx tsc --noEmit

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run client tests with coverage
        working-directory: client
        run: npx vitest run --coverage

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests with coverage
        working-directory: server
        run: npx vitest run --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-client, test-server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            client/dist
            server/dist
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Build PR branch
        run: |
          npm ci
          npm run build:client

      - name: Measure PR bundle size
        id: pr_size
        run: |
          total=$(du -sb client/dist/assets | cut -f1)
          js=$(find client/dist/assets -name '*.js' -exec du -sb {} + | awk '{s+=$1} END {print s+0}')
          css=$(find client/dist/assets -name '*.css' -exec du -sb {} + | awk '{s+=$1} END {print s+0}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "css=$css" >> "$GITHUB_OUTPUT"

      - name: Build base branch
        working-directory: base
        run: |
          npm ci
          npm run build:client

      - name: Measure base bundle size
        id: base_size
        run: |
          total=$(du -sb base/client/dist/assets | cut -f1)
          js=$(find base/client/dist/assets -name '*.js' -exec du -sb {} + | awk '{s+=$1} END {print s+0}')
          css=$(find base/client/dist/assets -name '*.css' -exec du -sb {} + | awk '{s+=$1} END {print s+0}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "css=$css" >> "$GITHUB_OUTPUT"

      - name: Comment bundle size report
        uses: actions/github-script@v7
        with:
          script: |
            function formatBytes(bytes) {
              if (bytes === 0) return '0 B';
              const k = 1024;
              const sizes = ['B', 'KB', 'MB'];
              const i = Math.floor(Math.log(Math.abs(bytes) || 1) / Math.log(k));
              return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
            }
            function diffIcon(diff) {
              if (diff > 10240) return '🔴';
              if (diff > 0) return '🟡';
              if (diff < 0) return '🟢';
              return '⚪';
            }

            const pr = {
              total: parseInt('${{ steps.pr_size.outputs.total }}'),
              js: parseInt('${{ steps.pr_size.outputs.js }}'),
              css: parseInt('${{ steps.pr_size.outputs.css }}'),
            };
            const base = {
              total: parseInt('${{ steps.base_size.outputs.total }}'),
              js: parseInt('${{ steps.base_size.outputs.js }}'),
              css: parseInt('${{ steps.base_size.outputs.css }}'),
            };

            const totalDiff = pr.total - base.total;
            const jsDiff = pr.js - base.js;
            const cssDiff = pr.css - base.css;

            const body = `## 📦 Bundle Size Report

            | Asset | Base | PR | Diff | |
            |-------|------|-----|------|-|
            | **JS** | ${formatBytes(base.js)} | ${formatBytes(pr.js)} | ${totalDiff >= 0 ? '+' : ''}${formatBytes(jsDiff)} | ${diffIcon(jsDiff)} |
            | **CSS** | ${formatBytes(base.css)} | ${formatBytes(pr.css)} | ${totalDiff >= 0 ? '+' : ''}${formatBytes(cssDiff)} | ${diffIcon(cssDiff)} |
            | **Total** | ${formatBytes(base.total)} | ${formatBytes(pr.total)} | ${totalDiff >= 0 ? '+' : ''}${formatBytes(totalDiff)} | ${diffIcon(totalDiff)} |

            ${totalDiff > 102400 ? '⚠️ **Warning:** Bundle size increased by more than 100KB!' : ''}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Bundle Size Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
