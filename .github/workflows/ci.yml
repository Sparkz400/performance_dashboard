name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify report layout and complete PDF text
        if: runner.os == 'Linux'
        run: |
          python -m pip install pypdf==6.10.0
          node scripts/test-report-pdf.mjs
          python scripts/check-report-pdf.py
      - run: node scripts/test-dev-dependencies.mjs
      - run: npm run db:generate -w server
      - name: Reject uncommitted migration changes
        run: node -e "if(require('node:child_process').execFileSync('git',['status','--porcelain','--','server/drizzle'],{encoding:'utf8'}).trim())process.exit(1)"
      - run: npm run storybook:build -w client
        if: runner.os == 'Linux'
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - run: npx tsc --noEmit -p client/tsconfig.json
      - run: npm run lint
      - run: npm run format:check -w client
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          include-hidden-files: true
          path: |
            client/coverage/
            server/coverage/
            .local/report-evidence/
          retention-days: 7
  browser:
    name: Browser and database
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard-local
          POSTGRES_DB: performance_dashboard
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dashboard -d performance_dashboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_USERNAME: admin
      E2E_PASSWORD: ci-only-admin-password
      SEED_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp server/.env.example server/.env
      - run: npm run build:server
      - run: npm run db:migrate -w server
      - run: npm run db:seed -w server
      - run: node scripts/test-measurements.mjs
      - run: node scripts/test-p0.mjs
      - run: node scripts/test-tracing.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-recovery.mjs
      - run: node scripts/test-access.mjs
      - run: node scripts/test-history.mjs
      - run: node scripts/test-quality-line.mjs
      - run: node scripts/test-daily-workflows.mjs
        env:
          DAILY_BROWSER: "1"
      - run: node scripts/test-production.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-evidence
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .local/production-evidence/
            .local/daily-evidence/
          retention-days: 7
  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t performance-dashboard:ci .
      - run: docker run --rm --entrypoint node performance-dashboard:ci ../scripts/test-runtime.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/test-container.mjs performance-dashboard:ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-operations.mjs performance-dashboard:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: operations-evidence
          include-hidden-files: true
          path: |
            .local/operations-*/validation.json
            .local/operations-*/capacity.json
            .local/operations-*/recovery-preview.png
          retention-days: 7
