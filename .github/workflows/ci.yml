name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify report layout and complete PDF text
        if: runner.os == 'Linux'
        run: |
          python -m pip install pypdf==6.10.0
          node scripts/test-report-pdf.mjs
          python scripts/check-report-pdf.py
      - run: npm run profiles:check
      - run: node scripts/run-correctness-benchmark.mjs --out .local/correctness-benchmark/result.json
      - run: node scripts/test-correctness-benchmark.mjs
      - run: node scripts/test-ci-feedback.mjs
      - run: node scripts/test-dev-dependencies.mjs
      - run: node scripts/test-dependency-audit.mjs
      - run: node scripts/test-release-package.mjs
      - run: npm run db:generate -w server
      - name: Reject uncommitted migration changes
        run: node -e "if(require('node:child_process').execFileSync('git',['status','--porcelain','--','server/drizzle'],{encoding:'utf8'}).trim())process.exit(1)"
      - run: npm run storybook:build -w client
        if: runner.os == 'Linux'
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - run: npx tsc --noEmit -p client/tsconfig.json
      - run: npm run lint
      - run: npm run format:check -w client
      - run: npm run test:coverage
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - name: Windows endurance transport and receipt regressions
        if: runner.os == 'Windows'
        run: |
          node scripts/test-endurance-harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-browser-resources.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          include-hidden-files: true
          path: |
            client/coverage/
            server/coverage/
            .local/correctness-benchmark/
            .local/report-evidence/
            .local/community-evidence/
          retention-days: 7
  browser-suites:
    name: Browser suite (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard-local
          POSTGRES_DB: performance_dashboard
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dashboard -d performance_dashboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_USERNAME: admin
      E2E_PASSWORD: ci-only-admin-password
      SEED_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp server/.env.example server/.env
      - run: npm run build
      - run: npm run db:migrate -w server
      - run: npm run db:seed -w server
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-ci-suite.mjs ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-evidence-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .local/ci-feedback/
            playwright-report/
            test-results/
            .local/community-evidence/
            .local/production-evidence/
            .local/daily-evidence/
            .local/ui-rework-evidence/
            .local/pd-installation-*/status.json
            .local/pd-installation-*/cycles.jsonl
            .local/pd-installation-*/browser-*.png
          retention-days: 7
  browser:
    name: Browser and database
    if: ${{ always() }}
    needs: [browser-suites]
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser/database suite
        env:
          RESULT: ${{ needs['browser-suites'].result }}
        run: test "$RESULT" = success
  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t performance-dashboard:ci .
      - run: docker run --rm --entrypoint node performance-dashboard:ci ../scripts/test-runtime.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/test-container.mjs performance-dashboard:ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-operations.mjs performance-dashboard:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: operations-evidence
          include-hidden-files: true
          path: |
            .local/operations-*/validation.json
            .local/operations-*/capacity.json
            .local/operations-*/recovery-preview.png
          retention-days: 7
