name: performance-dashboard
services:
  app:
    build: .
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: dashboard
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: performance_dashboard
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      OPCUA_IP: ${OPCUA_IP:-host.docker.internal}
      OPCUA_PORT: ${OPCUA_PORT:-4841}
      OPCUA_RESOURCE_PATH: ${OPCUA_RESOURCE_PATH:-/UA/MyLittleServer}
    volumes:
      - measurements:/app/server/data
      - certificates:/app/server/certificates
      - reports:/app/server/reports
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: performance_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard -d performance_dashboard']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  measurements:
  certificates:
  reports:
